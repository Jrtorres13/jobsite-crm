<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobSite CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --fg:#0F172A; --muted:#5B6678; --line:#E2E8F0; --soft:#F1F5F9;
  --side:#111827; --side-fg:#CBD5E1; --side-active:#1F2937;
  --primary:#D97706; --primary-fg:#111827; --primary-soft:#FEF3C7;
  --blue:#2563EB; --green:#059669; --green-soft:#D1FAE5; --red:#DC2626; --red-soft:#FEE2E2; --amber-soft:#FEF3C7; --blue-soft:#DBEAFE;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --radius:10px;
  --font:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Fira Code',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0B1120; --card:#111827; --fg:#E5E7EB; --muted:#9AA4B2; --line:#1F2937; --soft:#172033;
  --side:#070B14; --side-fg:#94A3B8; --side-active:#172033;
  --primary:#F59E0B; --primary-fg:#111827; --primary-soft:#3B2A0A;
  --green-soft:#063A2C; --red-soft:#3D1212; --amber-soft:#3B2A0A; --blue-soft:#0F2550;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
/* sidebar */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:16px 10px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff;font-weight:700;font-size:16px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:#111827}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--side-fg)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;color:inherit;text-align:left;width:100%;transition:background .2s}
.nav:hover{background:var(--side-active);color:#fff}
.nav.on{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.side .spacer{flex:1}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.top h1{font-size:20px;margin:0;font-weight:600}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:280px}
.search input{border:0;background:none;outline:none;width:100%}
.view{flex:1;overflow:auto;padding:20px 24px 40px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:500;transition:background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.icon{padding:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .bd{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* bars */
.bar{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--primary);border-radius:99px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cols .c .b{width:100%;max-width:44px;background:var(--green);border-radius:6px 6px 0 0;min-height:2px}
.cols .c span{font-size:11px;color:var(--muted)}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:24px}
/* pills */
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--primary)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
/* pipeline */
.board{display:flex;gap:12px;align-items:flex-start;min-height:100%;padding-bottom:12px}
.col{flex:0 0 250px;background:var(--soft);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 170px)}
.col .ch{padding:10px 12px;border-bottom:1px solid var(--line)}
.col .ch b{font-size:13px}
.col .ch .t{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:2px}
.col .cb{padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:60px}
.col.over{outline:2px dashed var(--primary);outline-offset:-2px}
.jc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:grab;box-shadow:var(--shadow);transition:border-color .2s}
.jc:hover{border-color:var(--primary)}
.jc .nm{font-weight:600;font-size:13px}
.jc .meta{font-size:12px;color:var(--muted);margin-top:2px}
.jc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px}
.jc .val{font-weight:600;font-variant-numeric:tabular-nums}
.jc.dragging{opacity:.5}
.stagebar{height:3px;border-radius:3px;margin:-10px -10px 8px}
/* tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--soft)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;width:100%;color:var(--fg)}
textarea.in{min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
table .in{padding:5px 7px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(900px,96vw);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column;visibility:hidden}
.drawer.on{transform:none;visibility:visible;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.dh{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow:auto}
.tab{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--primary)}
.db{flex:1;overflow:auto;padding:18px 20px 40px}
.stepper{display:flex;gap:4px;margin-top:12px;overflow:auto}
.step{flex:1;min-width:70px;border:0;padding:6px 4px;font-size:11px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:500}
.step.done{background:var(--primary-soft);color:var(--primary)}
.step.cur{background:var(--primary);color:var(--primary-fg)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sum .card{padding:12px}
.sum .l{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.sum .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
/* modal */
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(15,23,42,.5)}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:12px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.modal .mb{padding:16px 20px}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .dn{background:var(--soft);padding:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.cal .d{background:var(--card);min-height:104px;padding:4px 6px;font-size:12px}
.cal .d.out{background:var(--soft);color:var(--muted)}
.cal .d.today .n{background:var(--primary);color:var(--primary-fg);border-radius:99px;padding:0 6px}
.cal .ev{display:block;margin-top:3px;padding:2px 6px;border-radius:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;width:100%;text-align:left;background:var(--blue-soft);color:var(--blue)}
.cal .ev.task{background:var(--amber-soft);color:var(--primary)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.photos figcaption{font-size:11px;color:var(--muted)}
.photos .x{position:absolute;top:4px;right:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;transition:transform .25s;z-index:40}
.toast.on{transform:translateX(-50%)}
.chk{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.done-t{text-decoration:line-through;color:var(--muted)}
.note{border-left:3px solid var(--primary);padding:6px 10px;margin-bottom:10px;background:var(--card);border-radius:0 8px 8px 0}
.note .w{font-size:11px;color:var(--muted)}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;padding:6px;overflow-x:auto}.side .brand,.side .spacer{display:none}.nav{width:auto;white-space:nowrap;flex:none}#nav{display:flex;gap:2px}.top h1{display:none}.search{width:auto;flex:1}.sum{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M2 20h20M5 20V10l7-6 7 6v10M9 20v-6h6v6"/></svg></div><div><span id="brandName">JobSite CRM</span><small>Construction CRM</small></div></div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <button class="nav" id="themeBtn"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark mode</button>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="title">Dashboard</h1>
      <div class="grow"></div>
      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Search jobs, customers, addresses" aria-label="Search"></div>
      <button class="btn primary" id="newJobBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New lead</button>
    </div>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job details"></aside>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* ---------- constants ---------- */
const STAGES=[
 {id:'lead',name:'New Lead',color:'#64748B'},
 {id:'contacted',name:'Contacted',color:'#0EA5E9'},
 {id:'visit',name:'Site Visit',color:'#6366F1'},
 {id:'estimate',name:'Estimate Sent',color:'#8B5CF6'},
 {id:'followup',name:'Follow-Up',color:'#EC4899'},
 {id:'sold',name:'Sold',color:'#059669'},
 {id:'scheduled',name:'Scheduled',color:'#14B8A6'},
 {id:'progress',name:'In Progress',color:'#D97706'},
 {id:'punch',name:'Punch List',color:'#EA580C'},
 {id:'invoiced',name:'Invoiced',color:'#2563EB'},
 {id:'paid',name:'Paid / Closed',color:'#16A34A'},
 {id:'lost',name:'Lost',color:'#DC2626'}
];
const SALES=['lead','contacted','visit','estimate','followup'];
const WON=['sold','scheduled','progress','punch','invoiced','paid'];
const PRODUCTION=['sold','scheduled','progress','punch'];
const STALE_DAYS=7;
const COST_CATS=['Materials','Labor','Subcontractor','Equipment','Permits','Other'];
const IC={
 dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
 pipe:'<path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v6h-4z"/>',
 jobs:'<path d="M3 7h18v13H3zM8 7V4h8v3"/>',
 people:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>',
 task:'<path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 money:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
 print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
 left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
 alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>'
};
const icon=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const money2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const kmoney=n=>Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e4?'$'+Math.round(n/1e3)+'k':money(n);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const shortDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const stage=id=>STAGES.find(s=>s.id===id)||STAGES[0];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- storage ---------- */
const KEY='jobsite-crm-v1';
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save: storage full. Export a backup.')}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S)S=seed();migrate()}
function migrate(){S.settings=Object.assign(defaultSettings(),S.settings||{});S.customers??=[];S.jobs??=[];S.tasks??=[];S.jobs.forEach(j=>{j.estimate??={items:[],notes:'',status:'draft'};j.changeOrders??=[];j.invoices??=[];j.costs??=[];j.notes??=[];j.history??=[];j.budget??=0})}

/* ---------- photo store (IndexedDB) ---------- */
const PDB={db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('jobsite-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'}).createIndex('job','job');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
 async add(rec){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
 async list(job){const db=await this.open();return new Promise(res=>{const out=[];const r=db.transaction('p').objectStore('p').index('job').openCursor(IDBKeyRange.only(job));r.onsuccess=()=>{const c=r.result;if(c){out.push(c.value);c.continue()}else res(out)}})},
 async del(id){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res})},
 async all(){const db=await this.open();return new Promise(res=>{const r=db.transaction('p').objectStore('p').getAll();r.onsuccess=()=>res(r.result)})},
 async clear(){const db=await this.open();return new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').clear();t.oncomplete=res})}
};

/* ---------- money math ---------- */
function lineTotal(it){return num(it.qty)*num(it.cost)*(1+num(it.markup)/100)}
function estSubtotal(j){return j.estimate.items.reduce((a,it)=>a+lineTotal(it),0)}
function estCost(j){return j.estimate.items.reduce((a,it)=>a+num(it.qty)*num(it.cost),0)}
function estTax(j){return estSubtotal(j)*num(j.estimate.taxRate??S.settings.taxRate)/100}
function estTotal(j){return estSubtotal(j)+estTax(j)}
function coTotal(j){return j.changeOrders.filter(c=>c.status==='approved').reduce((a,c)=>a+num(c.amount),0)}
function contract(j){return (j.estimate.items.length?estTotal(j):num(j.value))+coTotal(j)}
function invoiced(j){return j.invoices.reduce((a,i)=>a+num(i.amount),0)}
function paidOf(inv){return (inv.payments||[]).reduce((a,p)=>a+num(p.amount),0)}
function paid(j){return j.invoices.reduce((a,i)=>a+paidOf(i),0)}
function costs(j){return j.costs.reduce((a,c)=>a+num(c.amount),0)}
function budgetOf(j){return num(j.budget)||estCost(j)}
function cust(id){return S.customers.find(c=>c.id===id)||{name:'(no customer)'}}
function daysInStage(j){return daysBetween((j.stageAt||j.created).slice(0,10),today())}
function isStale(j){return SALES.includes(j.stage)&&daysInStage(j)>=STALE_DAYS}
function invStatus(inv){const p=paidOf(inv);if(p>=num(inv.amount)-0.005&&num(inv.amount)>0)return['Paid','green'];if(inv.due&&inv.due<today())return['Overdue','red'];if(p>0)return['Partial','amber'];return['Open','blue']}

function moveStage(id,to,silent){const j=S.jobs.find(x=>x.id===id);if(!j||j.stage===to)return;
 if(to==='lost'&&!silent){promptBox('Mark as lost','Why was this job lost? (helps you improve)','e.g. Price too high',r=>{j.lostReason=r;moveStage(id,to,true)});return}
 j.history.push({from:j.stage,to,at:new Date().toISOString()});j.stage=to;j.stageAt=new Date().toISOString();
 if(to==='sold'&&j.estimate.items.length)j.estimate.status='signed';
 // automation: suggested follow-up tasks
 const auto={contacted:'Book site visit',visit:'Prepare + send estimate',estimate:'Follow up on estimate (3 days)',sold:'Collect deposit + order materials',scheduled:'Confirm start date with customer',punch:'Walkthrough with customer',invoiced:'Collect final payment'}[to];
 if(auto&&!S.tasks.some(t=>t.jobId===id&&t.title===auto)){S.tasks.push({id:uid(),jobId:id,title:auto,due:addDays(today(),to==='estimate'?3:1),done:false,who:''})}
 save();render();toast(`Moved to ${stage(to).name}${auto?' · task added':''}`)}

 const c=cust(j.customerId),si=STAGES.findIndex(s=>s.id===j.stage);
 const tabs=[['overview','Overview'],['estimate','Estimate'],['changes','Change orders'],['invoices','Invoices'],['costs','Job costing'],['tasks','Tasks'],['notes','Notes'],['photos','Photos']];
 const sc=s=>{const i=STAGES.findIndex(x=>x.id===s.id);return j.stage==='lost'?'':i<si?'done':i===si?'cur':''};
 $('#drawer').innerHTML=`<div class="dh"><div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="muted mono">JOB #${j.num} · ${esc(j.type||'')}</div><h2>${esc(j.name)}</h2><div class="muted">${esc(c.name)}${c.phone?' · <a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a>':''}${j.address?' · '+esc(j.address):''}</div></div>
  ${j.stage==='lost'?`<span class="pill red">Lost${j.lostReason?': '+esc(j.lostReason):''}</span>`:`<button class="btn sm danger" id="markLost">Mark lost</button>`}
  <button class="btn icon" id="closeD" aria-label="Close">${icon('x')}</button></div>
  <div class="stepper">${STAGES.filter(s=>s.id!=='lost').map(s=>`<button class="step ${sc(s)}" data-stage="${s.id}" title="Move to ${s.name}">${s.name}</button>`).join('')}</div></div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${jobTab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="db" id="db"></div>`;
 $('#closeD').onclick=closeDrawer;const ml=$('#markLost');if(ml)ml.onclick=()=>moveStage(j.id,'lost');
 document.querySelectorAll('.step').forEach(b=>b.onclick=()=>moveStage(j.id,b.dataset.stage));
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{jobTab=b.dataset.tab;renderDrawer()});
 ({overview:tOverview,estimate:tEstimate,changes:tChanges,invoices:tInvoices,costs:tCosts,tasks:tTasks,notes:tNotes,photos:tPhotos})[jobTab](j);

/* ---------- settings ---------- */
function settings(){const s=S.settings;
 const listEd=(k,l)=>`<label class="f">${l} <span class="muted">(one per line)</span><textarea class="in" id="s_${k}" style="min-height:140px">${esc(s[k].join('\n'))}</textarea></label>`;
 $('#view').innerHTML=`<div class="grid2" style="grid-template-columns:1fr 1fr">
 <div class="card"><div class="hd"><h3>Company (shown on estimates & invoices)</h3></div><div class="bd form">
  <label class="f full">Company name<input class="in" id="s_company" value="${esc(s.company)}"></label>
  <label class="f">Phone<input class="in" id="s_phone" value="${esc(s.phone)}"></label><label class="f">Email<input class="in" id="s_email" value="${esc(s.email)}"></label>
  <label class="f full">Address<input class="in" id="s_address" value="${esc(s.address)}"></label>
  <label class="f">License #<input class="in" id="s_license" value="${esc(s.license)}"></label><label class="f">Default tax %<input class="in" id="s_taxRate" value="${s.taxRate}"></label>
  <label class="f">Default markup %<input class="in" id="s_markup" value="${s.markup}"></label><span></span>
  <label class="f full">Terms on estimates<textarea class="in" id="s_terms">${esc(s.terms)}</textarea></label>
 </div></div>
 <div class="card"><div class="hd"><h3>Lists</h3></div><div class="bd form">${listEd('crews','Crews & subs')}${listEd('sources','Lead sources')}<div class="full">${listEd('types','Job types')}</div></div></div></div>
 <div class="card"><div class="hd"><h3>Backup & data</h3></div><div class="bd row">
  <button class="btn" id="bk">Download backup</button><button class="btn" id="rs">Restore from backup</button><button class="btn danger" id="wipe">Erase everything</button>
  <span class="muted" style="font-size:12px">Data lives only on this computer. Download a backup weekly and keep it somewhere safe (e.g. OneDrive).</span></div></div>`;
 ['company','phone','email','address','license','terms'].forEach(k=>$('#s_'+k).onchange=e=>{s[k]=e.target.value.trim();save();nav()});
 ['taxRate','markup'].forEach(k=>$('#s_'+k).onchange=e=>{s[k]=num(e.target.value);save()});
 ['crews','sources','types'].forEach(k=>$('#s_'+k).onchange=e=>{s[k]=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean);save()});
 $('#bk').onclick=async()=>{let photos=[];try{photos=await PDB.all()}catch(e){}download(`jobsite-crm-backup-${today()}.json`,JSON.stringify({app:'jobsite-crm',v:1,data:S,photos}),'application/json');toast('Backup downloaded')};
 $('#rs').onclick=()=>{const f=$('#fileIn');f.accept='.json,application/json';f.multiple=false;f.onchange=()=>{const file=f.files[0];f.value='';if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='jobsite-crm'||!o.data)throw 0;confirmBox('Restore backup?','This replaces all current data with the backup.',async()=>{S=o.data;migrate();await PDB.clear();for(const p of o.photos||[])await PDB.add(p);save();render();toast('Backup restored')})}catch(e){toast('That file is not a JobSite CRM backup')}};r.readAsText(file)};f.click()};
 $('#wipe').onclick=()=>confirmBox('Erase everything?','All jobs, customers, tasks, invoices, photos and settings will be deleted. Download a backup first.',async()=>{localStorage.removeItem(KEY);await PDB.clear();S={settings:Object.assign(defaultSettings(),{demo:false}),customers:[],jobs:[],tasks:[]};save();render();toast('All data erased')});
}

/* ---------- print docs ---------- */
function printDoc(j,kind,obj){const s=S.settings,c=cust(j.customerId);const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print');return}
 let title,body,total;
 if(kind==='estimate'){title='Estimate';const e=j.estimate;total=estTotal(j);
  body=`<table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>${e.items.map(it=>{const p=lineTotal(it);return`<tr><td>${esc(it.desc)}</td><td class="r">${it.qty} ${esc(it.unit||'')}</td><td class="r">${money2(num(it.qty)?p/num(it.qty):0)}</td><td class="r">${money2(p)}</td></tr>`}).join('')}</tbody></table>
  <div class="tot"><div><span>Subtotal</span><span>${money2(estSubtotal(j))}</span></div>${estTax(j)?`<div><span>Tax (${e.taxRate??s.taxRate}%)</span><span>${money2(estTax(j))}</span></div>`:''}<div class="g"><span>Total</span><span>${money2(total)}</span></div></div>
  ${e.notes?`<h4>Scope of work</h4><p style="white-space:pre-wrap">${esc(e.notes)}</p>`:''}${s.terms?`<h4>Terms</h4><p style="white-space:pre-wrap">${esc(s.terms)}</p>`:''}
  <div class="sig"><div>Customer signature</div><div>Date</div></div>`}
 else if(kind==='invoice'){title='Invoice #'+obj.num;const p=paidOf(obj);
  body=`<p><b>Invoice date:</b> ${fmtDate(obj.date)} &nbsp; <b>Due:</b> ${fmtDate(obj.due)}</p><table><thead><tr><th>Description</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${esc(obj.desc||j.name)}</td><td class="r">${money2(num(obj.amount))}</td></tr></tbody></table>
  <div class="tot"><div><span>Contract total</span><span>${money2(contract(j))}</span></div><div><span>This invoice</span><span>${money2(num(obj.amount))}</span></div><div><span>Paid on this invoice</span><span>${money2(p)}</span></div><div class="g"><span>Amount due</span><span>${money2(num(obj.amount)-p)}</span></div></div>`}
 else{title='Change Order';body=`<p><b>Date:</b> ${fmtDate(obj.date)}</p><table><thead><tr><th>Change</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${esc(obj.desc)}</td><td class="r">${money2(num(obj.amount))}</td></tr></tbody></table><div class="tot"><div><span>Original contract</span><span>${money2(contract(j)-coTotal(j))}</span></div><div class="g"><span>This change</span><span>${money2(num(obj.amount))}</span></div></div><p>By signing, the customer approves this change to the scope and price.</p><div class="sig"><div>Customer signature</div><div>Date</div></div>`}
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)} - ${esc(j.name)}</title><style>body{font:14px/1.5 'Segoe UI',system-ui,sans-serif;color:#111;max-width:760px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;border-bottom:3px solid #D97706;padding-bottom:14px;margin-bottom:20px}h1{margin:0;font-size:22px}h2{margin:0;font-size:26px;color:#D97706;text-align:right}.m{color:#555;font-size:13px}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}th{background:#f4f4f5;font-size:12px;text-transform:uppercase}.r{text-align:right}.tot{margin-left:auto;width:300px}.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font-weight:700;font-size:17px;border-top:2px solid #111;margin-top:4px;padding-top:8px}.cols{display:flex;gap:40px}.sig{display:flex;gap:40px;margin-top:50px}.sig div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:12px;color:#555}h4{margin:24px 0 4px}@media print{body{margin:0}}</style></head><body>
 <header><div><h1>${esc(s.company)}</h1><div class="m">${esc(s.address)}<br>${esc(s.phone)} ${s.email?' · '+esc(s.email):''}${s.license?'<br>License #'+esc(s.license):''}</div></div><div><h2>${esc(title)}</h2><div class="m" style="text-align:right">Job #${j.num}<br>${fmtDate(today())}</div></div></header>
 <div class="cols"><div><b>Prepared for</b><br>${esc(c.name)}<br><span class="m">${esc(c.address||'')}<br>${esc(c.phone||'')} ${c.email?' · '+esc(c.email):''}</span></div><div><b>Job site</b><br>${esc(j.name)}<br><span class="m">${esc(j.address)}</span></div></div>
 ${body}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

/* ---------- modal + utils ---------- */
function modal(title,html,btns){$('#modalBox').innerHTML=`<div class="mh">${title}</div><div class="mb">${html}</div><div class="mf">${btns.filter(Boolean).map((b,i)=>`<button class="btn ${b.c||''}" data-mb="${i}">${b.l}</button>`).join('')}<button class="btn" data-close>Cancel</button></div>`;
 const bs=btns.filter(Boolean);document.querySelectorAll('[data-mb]').forEach(el=>el.onclick=()=>{if(bs[el.dataset.mb].f()!==false)closeModal()});$('[data-close]').onclick=closeModal;$('#modal').classList.add('on');setTimeout(()=>$('#modalBox input:not([type=hidden]),#modalBox select')?.focus(),30)}
function closeModal(){$('#modal').classList.remove('on')}
function confirmBox(t,msg,ok){modal(esc(t),`<p style="margin:0">${esc(msg)}</p>`,[{l:'Yes, continue',c:'primary',f:()=>{ok()}}])}
function promptBox(t,msg,ph,ok){modal(esc(t),`<label class="f">${esc(msg)}<input class="in" id="pb_in" placeholder="${esc(ph)}"></label>`,[{l:'Save',c:'primary',f:()=>{ok($('#pb_in').value.trim())}}])}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csv(name,rows){download(name,'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n'),'text/csv');toast('Exported '+name)}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme;$('#themeBtn').lastChild.textContent=S.settings.theme==='dark'?'Light mode':'Dark mode'}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const n=e.target.closest('.nav[data-v]');if(n){go(n.dataset.v);return}
 if(e.target.closest('#drawer,#modal'))return;
 const jb=e.target.closest('[data-job]');if(jb&&jb.dataset.job){openDrawer(jb.dataset.job,jb.dataset.tab);return}
 const cu=e.target.closest('[data-cust]');if(cu){customerForm(S.customers.find(c=>c.id===cu.dataset.cust))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(openJob)closeDrawer()}
 if(e.key==='Enter'&&e.target.classList?.contains('jc'))openDrawer(e.target.dataset.job);
 if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#scrim').onclick=closeDrawer;
$('#q').oninput=()=>{if(cur==='dashboard'||cur==='settings')cur='jobs';render()};
$('#newJobBtn').onclick=()=>jobForm();
$('#themeBtn').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();applyTheme()};
window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});

load();applyTheme();render();
</script>
<!--JRT-UPDATE:START (managed by shared/jrt-update; release.ps1 bumps the build number) -->
<div id="jrt-update" role="status" aria-live="polite" hidden>
  <span id="jrt-update-msg">A new version is ready.</span>
  <button type="button" id="jrt-update-go">Update now</button>
  <button type="button" id="jrt-update-later" aria-label="Later">Later</button>
</div>
<style>
  #jrt-update{position:fixed;z-index:2147483000;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:10px;max-width:min(440px,calc(100vw - 32px));padding:10px 10px 10px 16px;border-radius:14px;
    background:#16130f;color:#f6f1ea;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.35);
    font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;transform:translateY(0);opacity:1;transition:transform .22s ease,opacity .22s ease}
  #jrt-update[hidden]{display:none}
  #jrt-update.jrt-enter{transform:translateY(12px);opacity:0}
  #jrt-update-msg{flex:1;min-width:0}
  #jrt-update button{min-height:44px;padding:0 14px;border-radius:10px;border:0;cursor:pointer;font:inherit;font-weight:600}
  #jrt-update-go{background:#f08a3c;color:#1a0f05}
  #jrt-update-go:disabled{opacity:.6;cursor:progress}
  #jrt-update-later{background:transparent;color:#cfc6ba}
  #jrt-update button:focus-visible{outline:2px solid #f6f1ea;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#jrt-update{transition:none}}
</style>
<script>
(function () {
  var APP = 'jobsite-crm', BUILD = 2 /*@JRT_BUILD@*/;
  var VERSION_URL = 'https://raw.githubusercontent.com/Jrtorres13/' + APP + '/main/version.json';
  var KEY = 'jrt-update:' + APP;
  // The web copy (GitHub Pages) is always the newest already, and the phone can't run the PC updater.
  var local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!local) return;

  var box = document.getElementById('jrt-update'), msg = document.getElementById('jrt-update-msg'),
      go = document.getElementById('jrt-update-go'), later = document.getElementById('jrt-update-later');
  function read() { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function write(v) { try { v ? sessionStorage.setItem(KEY, JSON.stringify(v)) : sessionStorage.removeItem(KEY); } catch (e) {} }
  function show(text, busy) {
    msg.textContent = text; go.disabled = !!busy; go.hidden = false; later.hidden = !!busy;
    if (box.hidden) { box.hidden = false; box.classList.add('jrt-enter'); requestAnimationFrame(function () { box.classList.remove('jrt-enter'); }); }
  }

  // After "Update now": the updater replaces the files, and this page reloads until it is the new version.
  var pending = read();
  if (pending && pending.target) {
    if (BUILD >= pending.target) { write(null); show('Updated. You’re on the newest version.'); go.hidden = true; later.textContent = 'OK'; later.hidden = false; }
    else if (Date.now() - pending.at < 120000) { show('Updating… this window refreshes by itself.', true); setTimeout(function () { location.reload(); }, 4000); return; }
    else { write(null); show('The update didn’t finish. Check the update window, or try again.'); }
  }

  var latest = null;
  function check() {
    fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
      if (!v || !(v.build > BUILD) || localStorage.getItem(KEY + ':skip') == v.build) return;
      latest = v;
      show('A new version is ready' + (v.notes ? ': ' + v.notes : '.'));
    }).catch(function () { /* offline: try again later */ });
  }
  go.onclick = function () {
    if (!latest) return;
    write({ target: latest.build, at: Date.now() });
    show('Updating… this window refreshes by itself.', true);
    location.href = 'jrtapp://update/' + APP;
    setTimeout(function () { location.reload(); }, 6000);
  };
  later.onclick = function () { if (latest) try { localStorage.setItem(KEY + ':skip', latest.build); } catch (e) {} box.hidden = true; };
  check();
  setInterval(check, 6 * 3600 * 1000);
})();
</script>
<!--JRT-UPDATE:END-->
</body>
</html>
